minimumReleaseAge: 0

packages:
  - "packages/**/*"
  - "examples/**/*"
  - "docs"

allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true

catalog:
  # Also manually keep `examples/pf/package.json` synced.
  astro: ^7.0.2
  sharp: ^0.34.5
  "@astrojs/check": ^0.9.9
  "@types/node": ^24.12.0

# The following make it possible to use workspace packages in examples
# without having to use "workspace:" specifiers for the dependency.
linkWorkspacePackages: true
preferWorkspacePackages: true
